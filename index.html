<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
NULL-01 SYSTEM
</title>


<link rel="stylesheet" href="style.css">


</head>



<body>



<div class="ambient"></div>



<div class="terminal">



<div class="top">

NULL-01 SYSTEM

</div>




<div class="screen">



<div id="main">


<p>

SYSTEM STATUS：

<span class="danger">

OFFLINE

</span>

</p>



<p>

未知系统等待访问。

</p>



<br>



<button onclick="startGame()">

进入系统

</button>



</div>




<div id="boot" style="display:none;">


<p id="bootText"></p>


</div>



</div>



</div>





<script>


function startGame(){



document
.getElementById("main")
.style.display="none";



document
.getElementById("boot")
.style.display="block";



document.body.classList.add("glitch");




let text =

"正在启动 NULL-01 系统...\n\n"+

"检查数据完整性...\n\n"+

"发现异常文件...\n\n"+

"尝试恢复...\n\n"+

"警告：部分档案已删除\n\n"+

"错误代码：UNDEFINED";




let i=0;


let box=document
.getElementById("bootText");





function typing(){



if(i < text.length){



if(text[i]==="\n"){


box.innerHTML+="<br>";



}else{


box.innerHTML+=text[i];


}



i++;


setTimeout(
typing,
70
);



}



else{


setTimeout(()=>{


window.location.href=
"pages/log.html";


},1800);



}



}



typing();



}



</script>



</body>

</html>
