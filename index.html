<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
NULL-01 SYSTEM
</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="terminal">


<div class="top">

NULL-01 SYSTEM

</div>



<div class="screen">


<div id="main">


<p>

SYSTEM STATUS：

<span class="danger">

OFFLINE

</span>

</p>


<p>

未知系统等待访问。

</p>


<br>


<button onclick="startGame()">

进入系统

</button>


</div>



<div id="boot" style="display:none;">


<p id="bootTitle"></p>


<p id="bootText"></p>


</div>


</div>


</div>




<script>


function startGame(){


document.getElementById("main").style.display="none";


document.getElementById("boot").style.display="block";



let title =
"NULL-01 SYSTEM\nBOOT SEQUENCE\n\n";



let logs = [

"[OK] 电源模块启动",

"[OK] 核心服务加载",

"[OK] 数据库连接建立",

"",

"正在检查数据完整性...",

"",

"███████░░░ 73%",

"",

"发现未知文件...",

"",

"文件编号：NULL-01",

"",

"正在尝试恢复...",

"",

"恢复进度：12%",

"恢复进度：27%",

"恢复进度：46%",

"",

"错误。",

"",

"恢复对象不存在。",

"",

"重新建立索引...",

"",

"系统启动完成。",

"",

"访问者已确认。"

];



let titleBox =
document.getElementById("bootTitle");


let textBox =
document.getElementById("bootText");



let a=0;



function typeTitle(){


if(a<title.length){


if(title[a]=="\n"){

titleBox.innerHTML+="<br>";

}

else{

titleBox.innerHTML+=title[a];

}


a++;


setTimeout(typeTitle,80);


}

else{


typeLog();


}



}




let b=0;



function typeLog(){


if(b<logs.length){


textBox.innerHTML += logs[b]+"<br>";


b++;


setTimeout(typeLog,350);


}

else{


setTimeout(()=>{


window.location.href="pages/log.html";


},2500);


}



}




typeTitle();



}



</script>


</body>

</html>
