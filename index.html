<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NULL-01 SYSTEM</title>

<link rel="stylesheet" href="style.css">


<style>


body{

animation:fadeIn 2s;

}


@keyframes fadeIn{

from{

opacity:0;

}

to{

opacity:1;

}

}



.boot-box{

animation:

powerOn 1.8s;

}



@keyframes powerOn{


0%{

transform:scaleY(0);

opacity:0;

}


60%{

transform:scaleY(1.1);

opacity:1;

}


100%{

transform:scaleY(1);

}

}



.system-title{


font-size:28px;

letter-spacing:5px;

text-align:center;

text-shadow:

0 0 15px #00ff88;


animation:

flicker 3s infinite;


}



@keyframes flicker{


0%,90%,100%{

opacity:1;

}


92%{

opacity:.4;

}


94%{

opacity:1;

}


}



.status-light{


display:inline-block;

width:8px;

height:8px;

background:#ff3333;

border-radius:50%;


box-shadow:

0 0 15px #ff3333;


animation:

blink 1s infinite;


}



@keyframes blink{


50%{

opacity:.3;

}


}



.scan{


position:fixed;

top:0;

left:0;

width:100%;

height:3px;

background:#00ff88;


box-shadow:

0 0 20px #00ff88;


animation:

scan 3s linear infinite;


}



@keyframes scan{


from{

top:0;

}


to{

top:100%;

}



}



</style>

</head>



<body>



<div class="scan"></div>



<div class="terminal boot-box">


<div class="top">

NULL-01 SYSTEM

</div>



<div class="screen">


<div class="system-title">

NULL-01

</div>


<br>


<p>

<span class="status-light"></span>

SYSTEM STATUS：

<span class="danger">

OFFLINE

</span>

</p>


<p>

未知系统等待访问。

</p>


<br>


<button onclick="startGame()">

进入系统

</button>


</div>



</div>




<script>


function startGame(){


document.body.classList.add("glitch");



let screen=document.querySelector(".screen");



screen.innerHTML=`

<p>

SYSTEM BOOTING...

</p>

<br>

<p id="load">

</p>

`;



let text=

"INITIALIZING...\n\n"+
"CHECKING FILE SYSTEM...\n\n"+
"UNKNOWN DATA FOUND...\n\n"+
"ACCESS GRANTED";



let i=0;

let box=document.getElementById("load");



function typing(){


if(i<text.length){


if(text[i]=="\n"){

box.innerHTML+="<br>";

}

else{

box.innerHTML+=text[i];

}


i++;


setTimeout(typing,45);


}

else{


setTimeout(()=>{

location.href="pages/log.html";


},1200);


}


}



typing();


}


</script>


</body>

</html>
