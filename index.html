<!DOCTYPE html>
<html lang="zh-CN">


<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>

NULL-01 SYSTEM

</title>


<link rel="stylesheet" href="style.css">


<style>


/* 开幕闪屏 */

#flash{

position:fixed;

inset:0;

background:#00ff88;

opacity:0;

pointer-events:none;

z-index:9999;

}



#flash.active{

animation:flashEffect .25s;

}



@keyframes flashEffect{


0%{

opacity:0;

}


30%{

opacity:.35;

}


100%{

opacity:0;

}


}



/* 初始出现 */

.terminal{


animation:

terminalOn 1.5s;


}



@keyframes terminalOn{


0%{

opacity:0;

transform:scale(.95);

filter:brightness(3);

}


50%{

opacity:1;

}


100%{

transform:scale(1);

filter:brightness(1);

}


}



/* 加载故障 */

.loading-glitch{


animation:

loadShake .3s;


}



@keyframes loadShake{


0%{

transform:translate(0);

}


25%{

transform:translate(-4px);

}


50%{

transform:translate(4px);

}


75%{

transform:translate(-2px);

}


100%{

transform:translate(0);

}


}


</style>


</head>





<body>


<div id="flash"></div>



<div class="terminal">



<div class="top">


NULL-01 SYSTEM


</div>





<div class="screen">



<div id="main">



<p>

SYSTEM STATUS：

<span class="danger">

OFFLINE

</span>


</p>




<p>

未知系统等待访问。

</p>



<br>



<button onclick="startGame()">

进入系统

</button>



</div>





<div id="boot" style="display:none;">


<p id="bootText">

</p>



</div>




</div>




</div>







<script>


function startGame(){



// 闪屏


document
.getElementById("flash")
.classList.add("active");



// 隐藏主页


document
.getElementById("main")
.style.display="none";



// 显示加载


document
.getElementById("boot")
.style.display="block";



// 故障效果


document
.querySelector(".terminal")
.classList.add("loading-glitch");





let text =


"正在启动 NULL-01 系统...\n\n"+

"检查数据完整性...\n\n"+

"发现异常文件...\n\n"+

"尝试恢复...\n\n"+

"警告：部分档案已删除\n\n"+

"错误代码：UNDEFINED";





let i=0;


let box=document
.getElementById("bootText");






function typing(){



if(i < text.length){



if(text[i]==="\n"){


box.innerHTML+="<br>";


}

else{


box.innerHTML+=text[i];


}



i++;


setTimeout(

typing,

70

);



}

else{



setTimeout(()=>{


window.location.href=

"pages/log.html";


},1800);



}


}




typing();



}



</script>




</body>


</html>
