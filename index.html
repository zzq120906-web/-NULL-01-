<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#000000">

<meta name="apple-mobile-web-app-status-bar-style" content="black">


<title>
NULL-01 SYSTEM
</title>


<link rel="stylesheet" href="style.css">


</head>


<body>


<div id="flash"></div>


<div class="data-stream">

01001001<br>
NULL-01<br>
RECOVERY<br>
DATA LOST<br>
ERROR<br>
00110101

</div>



<div class="terminal">


<div class="top">

NULL-01 SYSTEM

</div>




<div class="screen">


<div id="main">


<p id="status">

</p>


<p id="intro">

</p>


<br>


<button onclick="startGame()">

进入系统

</button>


</div>




<div id="boot" style="display:none;">


<p id="bootText"></p>


</div>



</div>



</div>





<script>


function typeText(element,text,speed,callback){


let i=0;


function typing(){


if(i<text.length){


element.innerHTML+=text[i];


i++;


setTimeout(
typing,
speed
);


}

else{


if(callback){

callback();

}


}


}


typing();


}




window.onload=function(){


setTimeout(()=>{


typeText(

document.getElementById("status"),

"SYSTEM STATUS：",

80,

()=>{


let span=document.createElement("span");


span.className="danger";


span.innerHTML=" OFFLINE";


document
.getElementById("status")
.appendChild(span);


}


);


},800);





setTimeout(()=>{


typeText(

document.getElementById("intro"),

"未知系统等待访问。",

90

);


},2200);



}





function startGame(){



document
.getElementById("flash")
.classList.add("active");



document
.body
.classList.add("warning-flash");



setTimeout(()=>{


document
.body
.classList.remove("warning-flash");


},200);





document
.getElementById("main")
.style.display="none";



document
.getElementById("boot")
.style.display="block";




document
.querySelector(".terminal")
.classList.add("loading-glitch");





let text =

"正在启动 NULL-01 系统...\n\n"+

"检查数据完整性...\n\n"+

"发现异常文件...\n\n"+

"尝试恢复...\n\n"+

"警告：部分档案已删除\n\n"+

"错误代码：UNDEFINED";





let i=0;


let box=document
.getElementById("bootText");





function bootTyping(){


if(i<text.length){



if(text[i]==="\n"){


box.innerHTML+="<br>";


}

else{


box.innerHTML+=text[i];


}



i++;


setTimeout(

bootTyping,

70

);



}

else{


setTimeout(()=>{


window.location.href=

"pages/log.html";


},1800);



}



}





bootTyping();



}



</script>


</body>

</html>
