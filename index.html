<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
NULL-01 SYSTEM
</title>

<link rel="stylesheet" href="style.css">

<style>

#bootText{

line-height:2;

}


.cursor::after{

content:"_";

animation:blink .8s infinite;

}


@keyframes blink{

50%{

opacity:0;

}

}


.glitch{

animation:glitch .15s;

}


@keyframes glitch{


0%{

transform:translate(0);

}


30%{

transform:translate(-5px,2px);

}


60%{

transform:translate(4px,-2px);

}


100%{

transform:translate(0);

}


}



.flash{

color:#ff3333;

}


</style>

</head>



<body>


<div class="terminal">


<div class="top">

NULL-01 SYSTEM

</div>



<div class="screen">



<div id="main">


<p>

SYSTEM STATUS：

<span class="danger">

OFFLINE

</span>

</p>



<p>

未知系统等待访问。

</p>


<br>


<button onclick="startGame()">

进入系统

</button>


</div>





<div id="boot" style="display:none;">


<p id="bootText" class="cursor"></p>


</div>



</div>



</div>




<script>


function startGame(){



document.getElementById("main").style.display="none";


document.getElementById("boot").style.display="block";



let box=document.getElementById("bootText");



let text = 

"NULL-01 SYSTEM\n\n"+

"正在唤醒...\n\n"+

"检查核心状态...\n\n"+

"读取异常记录...\n\n"+

"读取失败。\n\n"+

"尝试恢复最近一次状态...\n\n"+

"恢复对象不存在。\n\n"+

"继续启动...";



let i=0;



function typing(){



if(i < text.length){



let char=text[i];



if(char === "\n"){


box.innerHTML+="<br>";


}

else{


box.innerHTML+=char;


}



i++;


setTimeout(typing,90);



}



else{



setTimeout(()=>{



document.body.classList.add("glitch");



box.innerHTML+=

"<br><br><span class='flash'>ERROR：UNKNOWN ACCESS</span>";



setTimeout(()=>{


window.location.href="pages/log.html";


},1200);



},1800);



}



}



typing();



}


</script>



</body>

</html>
