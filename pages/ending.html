<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
NULL-01 SYSTEM
</title>

<link rel="stylesheet" href="../style.css">


<style>


.warning{

color:#ff3333;

}



.hidden-file{

animation:appear 1s;

}



@keyframes appear{


from{

opacity:0;

}


to{

opacity:1;

}


}


</style>


</head>



<body>



<div class="terminal">



<div class="top">

NULL-01 SYSTEM

</div>



<div class="screen">



<p id="text"></p>



</div>



</div>






<script>


let box=document.getElementById("text");



let lines=[


"第一阶段恢复完成。",


"",


"已确认异常档案：NULL-01",


"",


"系统检测到多个异常。",


"",


"异常一：",


"档案不存在。",


"",


"异常二：",


"档案拥有访问记录。",


"",


"异常三：",


"访问发生于系统启动之前。",


"",


"正在查询访问者信息...",


"",


"查询结果：UNKNOWN"



];



let i=0;



function type(){



if(i<lines.length){



box.innerHTML+=lines[i]+"<br>";


i++;


setTimeout(type,650);



}



else{



setTimeout(()=>{



box.innerHTML+=


`

<br>
<hr>

<p class="warning hidden-file">

发现未读取文件：

<br><br>

LOG-001

</p>


`;



setTimeout(()=>{


box.innerHTML+=


`

<br>

文件状态：

<br>

等待恢复。

`;



},1200);



},1500);



}



}



type();



</script>




</body>

</html>
