<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>

<link rel="stylesheet" href="../style.css">


<style>


.screen{

font-size:15px;

line-height:1.6;

}



.warning{

color:#ff3333;

}



.hidden{

animation:show 1s;

}



@keyframes show{


from{

opacity:0;

}


to{

opacity:1;

}


}



@media(max-width:768px){


.screen{

font-size:12px;

padding:10px;

}

</style>

<body>



<div class="terminal">


<div class="top">

NULL-01 SYSTEM

</div>



<div class="screen">


<div id="text"></div>



</div>



</div>






<script>


let box=document.getElementById("text");



let lines=[


"第一阶段恢复完成。",


"",


"异常档案：NULL-01",


"已确认。",


"",


"检测结果：",


"",


"档案状态：不存在",


"访问记录：存在",


"",

"",


"时间记录冲突。",


"",


"正在查询创建者...",


"",

];



let i=0;



function typing(){



if(i<lines.length){



box.innerHTML+=lines[i]+"<br>";

setTimeout(()=>{

setTimeout(()=>{


box.innerHTML+=

`

等待恢复。


`;



},1200);



},1200);



}



}



typing();



</script>
