<!DOCTYPE html>
<html lang="zh-CN">


<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
NULL-01 DATABASE
</title>


<link rel="stylesheet" href="../style.css">


</head>



<body>


<div class="terminal">


<div class="top">

NULL-01 DATABASE

</div>



<div class="screen">



<p>

数据库连接：

<span class="danger">
ONLINE
</span>

</p>



<p>

请输入档案编号：

</p>



<input 
id="search"
placeholder="ARCHIVE ID"
autocomplete="off"
>



<button onclick="searchFile()">

查询

</button>




<div id="result">

</div>
<a href="log.html">
<button>
返回上一页
</button>
</a>



<button onclick="backLog()">

返回日志

</button>



</div>



</div>





<script src="../script.js"></script>



<script>



function searchFile(){


let id =

document
.getElementById("search")
.value
.toUpperCase()
.trim();



let result =

document.getElementById("result");




if(id===""){


result.innerHTML=

`

<hr>

<p>

请输入档案编号。

</p>

`;

return;


}




result.innerHTML=

`

<hr>

<p>

正在连接数据库...

</p>

`;




setTimeout(function(){



if(id==="001"){



result.innerHTML=

`

<hr>


<p>

档案编号：

001

</p>


<p>

名称：

系统维护记录

</p>


<p>

状态：

正常

</p>


<p>

备注：

无异常。

</p>


`;



}




else if(id==="NULL"){



result.innerHTML=

`

<hr>


<p class="danger">

发现异常档案

</p>



<p>

编号：

NULL-01

</p>



<p>

状态：

不存在

</p>



<p>

创建时间：

未知

</p>



<p>

备注：

该文件没有创建记录。

</p>



<a href="mirror.html">
<button>
查看关联记录
</button>
</a>


`;



if(typeof saveClue === "function"){

saveClue("NULL-01");

}



}




else{


result.innerHTML=

`

<hr>


<p>

未找到档案。

</p>


<p>

查询行为已记录。

</p>


`;



}



},1000);



}






function enterMirror(){



document.querySelector(".terminal").style.opacity="0";



setTimeout(function(){


window.location.href=

"mirror.html";


},600);



}





function backLog(){


window.location.href=

"log.html";


}



</script>



</body>


</html>
