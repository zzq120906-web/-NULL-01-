<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
NULL-01 DATABASE
</title>

<link rel="stylesheet" href="../style.css">


<style>


#result{

margin-top:25px;

}



.normal{

color:#00ff88;

}



.error{

color:#ff3333;

}



.found{

font-size:20px;

color:#ff3333;

animation:flash .8s;

}



@keyframes flash{


0%{

opacity:0;

}


50%{

opacity:1;

}


100%{

opacity:1;

}


}



.scan{

animation:blink 1s infinite;

}


</style>


</head>



<body>



<div class="terminal">


<div class="top">

NULL-01 DATABASE

</div>



<div class="screen">



<p>

DATABASE STATUS:

<br>

ONLINE

</p>



<hr>



<p>

请输入档案编号：

</p>



<input id="code" placeholder="请输入编号">



<br>



<button onclick="searchFile()">

查询

</button>




<div id="result"></div>



<br>



<button onclick="location.href='log.html'">

返回日志

</button>



</div>



</div>






<script>


function searchFile(){



let code=

document.getElementById("code").value.trim();



let result=

document.getElementById("result");



result.innerHTML=

"<p class='scan'>正在检索...</p>";




setTimeout(()=>{



if(code==="001"){



result.innerHTML=

`

<hr>

<p class="normal">

档案编号：

<br>

001

</p>


<p>

类型：

<br>

系统维护记录

</p>


<p>

状态：

<br>

正常

</p>


<p>

备注：

<br>

无异常。

</p>

`;



}



else if(code==="000"){



result.innerHTML=

`

<hr>

<p>

档案编号：

<br>

000

</p>


<p>

状态：

<br>

空记录

</p>


<p>

备注：

<br>

该编号没有对应文件。

</p>

`;



}



else if(code.toUpperCase()==="NULL"){



result.innerHTML=

"<p>查询失败。</p>";




setTimeout(()=>{


document.body.classList.add("glitch");



result.innerHTML=


`

<hr>

<p class="found">

FOUND

</p>


<p>

档案编号：

<br>

NULL-01

</p>


<p>

状态：

<br>

不存在

</p>


<p>

创建时间：

<br>

2026-08-17

</p>


<p>

记录：

<br>

未知

</p>


`;



},1200);



}



else{



result.innerHTML=

`

<hr>

<p>

未找到对应档案。

</p>

`;



}



},1500);



}



</script>



</body>

</html>
