<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
NULL-01 DATABASE
</title>


<link rel="stylesheet" href="../style.css">


<style>


.screen{

font-size:15px;

line-height:1.5;

padding:15px;

}



.error{

color:#ff3333;

}



.found{

color:#ff3333;

font-size:20px;

}



@media(max-width:768px){


.screen{

font-size:12px;

padding:10px;

}



input{

font-size:14px;

}



}



</style>


</head>



<body>



<div class="terminal">



<div class="top">

NULL-01 DATABASE

</div>



<div class="screen">



<div id="page">


<p>

DATABASE STATUS:

<br>

ONLINE

</p>


<hr>


<p>

请输入档案编号：

</p>



<input id="code">


<br>



<button onclick="search()">

查询

</button>



<div id="result"></div>


</div>



</div>


</div>





<script>


function search(){



let code=

document.getElementById("code")

.value

.trim()

.toUpperCase();



let result=document.getElementById("result");



result.innerHTML=

`

<p>

正在检索...

</p>

`;



setTimeout(()=>{



if(code==="001"){



result.innerHTML=

`

<hr>


<p>

档案编号：

001

</p>


<p>

类型：

系统维护记录

</p>


<p>

状态：

正常

</p>


<p>

备注：

无异常。

</p>

`;



}



else if(code==="NULL-01"){



result.innerHTML=

`

<p class="error">

QUERY ERROR

</p>

`;



setTimeout(()=>{



result.innerHTML=

`

<hr>


<p class="found">

FOUND

</p>



<p>

档案编号：

<br>

NULL-01

</p>


<p>

状态：

<br>

不存在

</p>


<p>

创建时间：

<br>

2026-08-17

</p>



<p>

访问记录：

<br>

存在

</p>



<button onclick="location.href='mirror.html'">

查看关联记录

</button>


`;



},1000);



}



else{


result.innerHTML=

`

<hr>


<p>

未找到对应档案。

</p>

`;



}



},1000);



}



</script>


</body>

</html>
