<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
NULL-01 DATABASE
</title>

<link rel="stylesheet" href="../style.css">


<style>


#result{

margin-top:25px;

}



.error{

color:#ff3333;

}



.found{

color:#ff3333;

font-size:22px;

}



.hidden{

display:none;

}



.glitch{

animation:glitch .15s;

}



@keyframes glitch{


0%{

transform:translate(0);

}


30%{

transform:translate(-5px);

}


60%{

transform:translate(5px);

}


100%{

transform:translate(0);

}


}



</style>


</head>



<body>



<div class="terminal">



<div class="top">

NULL-01 DATABASE

</div>




<div class="screen">



<p>

DATABASE STATUS:

<br>

ONLINE

</p>



<hr>



<p>

请输入档案编号：

</p>



<input id="code" autocomplete="off">



<br>


<button onclick="searchFile()">

查询

</button>



<div id="result"></div>



</div>



</div>





<script>


let result=document.getElementById("result");



function searchFile(){



let code=document

.getElementById("code")

.value

.trim()

.toUpperCase();



result.innerHTML=

`

<p>

正在检索...

</p>

`;



setTimeout(()=>{



// 正常档案


if(code==="001"){



result.innerHTML=


`

<hr>

<p>

档案编号：

<br>

001

</p>


<p>

类型：

<br>

系统维护记录

</p>


<p>

状态：

<br>

正常

</p>


<p>

备注：

<br>

无异常。

</p>

`;



}



// 空档案


else if(code==="000"){



result.innerHTML=


`

<hr>

<p>

档案编号：

<br>

000

</p>


<p>

状态：

<br>

空记录

</p>


<p>

备注：

<br>

没有对应文件。

</p>

`;



}



// 异常档案


else if(code==="NULL-01"){



result.innerHTML=

`

<p class="error">

QUERY ERROR

</p>

`;



setTimeout(()=>{


document.body.classList.add("glitch");



result.innerHTML=


`

<hr>


<p class="found">

FOUND

</p>



<p>

档案编号：

<br>

NULL-01

</p>



<p>

状态：

<br>

不存在

</p>



<p>

创建时间：

<br>

2026-08-17

</p>



<p>

记录：

<br>

未知

</p>



<hr>



<p>

【残留记录】

</p>



<p>

访问时间：

<br>

2026-08-17 23:41

</p>



<p>

访问者：

<br>

UNKNOWN

</p>



<p>

检测到关联文件：

<br>

MIRROR

</p>



<button onclick="location.href='mirror.html'">

查看关联记录

</button>

`;



},1200);



}



// 其他


else{


result.innerHTML=


`

<hr>

<p>

未找到对应档案。

</p>

`;



}



},1200);



}



</script>



</body>

</html>
