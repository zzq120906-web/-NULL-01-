<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
LOG-000
</title>

<link rel="stylesheet" href="../style.css">


<style>

#page{

line-height:1.8;

}



.data{

letter-spacing:4px;

line-height:2;

}



.warning{

color:#ff3333;

}



.glitch{

animation:glitch .15s;

}



@keyframes glitch{

0%{

transform:translate(0);

}

30%{

transform:translate(-4px);

}

60%{

transform:translate(4px);

}

100%{

transform:translate(0);

}

}


</style>


</head>



<body>


<div class="terminal">


<div class="top">

NULL-01 SYSTEM

</div>



<div class="screen">


<div id="page"></div>



</div>



</div>






<script>


let page=document.getElementById("page");



let bootText=

"正在读取日志文件...\n\n"+

"文件完整度：47%\n\n"+

"警告：部分内容无法恢复。";



let i=0;



function boot(){



if(i<bootText.length){



let c=bootText[i];



if(c=="\n"){

page.innerHTML+="<br>";

}

else{

page.innerHTML+=c;

}



i++;


setTimeout(boot,70);



}

else{



setTimeout(showLog,1000);



}



}



function showLog(){



page.innerHTML=`

<p>

LOG-000

<br>

//

<br>

RECOVERY FILE

</p>


<hr>



<p>

编号：LOG-000

<br>

创建时间：2026-08-18

<br>

记录者：UNKNOWN

</p>



<hr>



<p>

【系统恢复记录】

</p>



<p>

第一次异常发生于系统重启之前。

</p>



<p>

删除请求：

已执行。

<br>

恢复请求：

已执行。

</p>



<p>

当前状态：

<br>

部分文件仍然存在。

</p>



<p>

原始记录数量：

0

<br>

当前检测数量：

1

</p>



<hr>



<p>

【损坏数据】

</p>



<div class="data">

01001110

<br>

01010101

<br>

01001100

<br>

01001100

</div>



<br>



<p>

数据完整度：

47%

<br>

来源：

未知

<br>

类型：

无法识别

</p>



<button onclick="analyze()">

分析损坏数据

</button>



<div id="analysis"></div>


`;



}



function analyze(){



let box=document.getElementById("analysis");



box.innerHTML=

`

<hr>


<p>

正在分析残留字符...

</p>


<p class="warning">

分析失败。

</p>



<p>

恢复片段：

<br>

N U L L

</p>



<p>

附加索引：

<br>

01

</p>



<p>

发现未知数据库入口。

</p>



<button onclick="location.href='archive.html'">

访问数据库

</button>

`;



document.body.classList.add("glitch");



setTimeout(()=>{


document.body.classList.remove("glitch");


},200);



}



boot();



</script>



</body>

</html>
