<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
MIRROR RECOVERY
</title>

<link rel="stylesheet" href="../style.css">


<style>


.warning{

color:#ff3333;

}


.hidden{

display:none;

}


.glitch{

animation:shake .15s;

}



@keyframes shake{


0%{

transform:translate(0);

}


30%{

transform:translate(-4px);

}


60%{

transform:translate(4px);

}


100%{

transform:translate(0);

}


}



.flash{

font-size:22px;

color:#ff3333;

}


</style>


</head>



<body>



<div class="terminal">



<div class="top">

MIRROR RECOVERY

</div>




<div class="screen">



<div id="loading">


<p id="text"></p>


</div>




<div id="content" style="display:none;">



<p>

镜像恢复服务

</p>


<hr>



<p>

状态：

<br>

恢复失败

</p>



<p>

缺少：

<br>

原始观察者记录

</p>



<hr>



<p>

残留数据：

</p>



<p>

DATE：

<br>

2026-08-17

</p>


<p>

USER：

<br>

UNKNOWN

</p>




<br>



<button onclick="location.href='ending.html'">

继续

</button>



</div>



</div>



</div>





<script>


let box=document.getElementById("text");



let content=document.getElementById("content");



let lines=[


"正在连接镜像服务...",


"",


"读取残留数据...",


"",


"恢复文件中...",


"",


"恢复失败。"



];



let i=0;



function show(){



if(i<lines.length){


box.innerHTML+=lines[i]+"<br>";

i++;


setTimeout(show,900);



}

else{



setTimeout(()=>{



document.body.classList.add("glitch");



box.innerHTML+=

`

<br>

<span class="flash">

USER FOUND

</span>

`;



setTimeout(()=>{


box.innerHTML="";


box.innerHTML=

"恢复完成。<br><br>";


content.style.display="block";


},1000);



},1500);



}



}



show();



</script>



</body>

</html>
