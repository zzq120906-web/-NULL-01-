<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
MIRROR RECOVERY
</title>


<link rel="stylesheet" href="../style.css">


<style>


.screen{

font-size:15px;

line-height:1.5;

padding:15px;

}



.warning{

color:#ff3333;

}



.flash{

color:#ff3333;

font-size:24px;

animation:flash .5s;

}



@keyframes flash{


0%{

opacity:0;

}


50%{

opacity:1;

}


100%{

opacity:1;

}



}



@media(max-width:768px){


.screen{

font-size:12px;

padding:10px;

}



}


</style>


</head>



<body>



<div class="terminal">


<div class="top">

MIRROR RECOVERY

</div>




<div class="screen">


<div id="page">


正在连接镜像服务...


</div>



</div>



</div>






<script>


let page=document.getElementById("page");



let step=0;



let loading=[


"正在连接镜像服务...",


"读取残留数据...",


"恢复文件中...",


"验证访问记录..."



];



function load(){



if(step<loading.length){



page.innerHTML+=

"<br><br>"+loading[step];


step++;


setTimeout(load,700);



}

else{



setTimeout(error,1200);



}



}



function error(){



document.body.classList.add("glitch");



page.innerHTML=


`

<p class="flash">

USER FOUND

</p>

`;



setTimeout(()=>{



page.innerHTML=

`

<p>

镜像恢复记录

</p>


<hr>



<p>

文件：

NULL-01

</p>


<p>

状态：

部分恢复

</p>


<p>

访问时间：

2026-08-17 23:41

</p>


<p>

访问者：

UNKNOWN

</p>


<hr>



<p class="warning">

恢复失败。

</p>


<p>

缺少：

<br>

原始观察者记录

</p>



<p>

发现关联日志：

<br>

LOG-001

</p>



<button onclick="location.href='ending.html'">

继续读取

</button>


`;



},1000);



}



load();



</script>


</body>


</html>
