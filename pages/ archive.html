<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>
NULL-01 DATABASE
</title>

<link rel="stylesheet" href="../style.css">

</head>


<body>


<div class="terminal">


<div class="header">

NULL-01 DATABASE

</div>


<div class="content">


<p>
数据库连接状态：
<span class="error">
ONLINE
</span>
</p>


<p>
请输入档案编号进行查询：
</p>


<input 
id="search"
placeholder="ARCHIVE ID">


<br>


<button onclick="searchFile()">

查询

</button>



<div id="result">

</div>



<br>


<button onclick="back()">

返回日志

</button>



</div>


</div>



<script>


function searchFile(){


let id =
document.getElementById("search").value
.toUpperCase();


let result =
document.getElementById("result");



if(id==="001"){


result.innerHTML=`

<hr>

<p>
档案编号：001
</p>


<p>
名称：
系统维护记录
</p>


<p>
状态：
已归档
</p>


<p>
内容：

普通服务器维护文件。

</p>

`;



}



else if(id==="NULL-01"){


result.innerHTML=`

<hr>

<p>
警告：
发现异常档案
</p>


<p>

编号：
NULL-01

</p>


<p>

状态：

不存在

</p>


<p>

创建时间：

未知

</p>


<br>


<p>

附加备注：

"不要相信删除记录。"

</p>


<p>

新线索：

MIRROR

</p>

`;



}



else{


result.innerHTML=`

<hr>

<p>

未找到档案。

</p>


<p>

查询记录已保存。

</p>

`;

}


}



function back(){


window.location.href="log.html";


}


</script>



</body>

</html>
