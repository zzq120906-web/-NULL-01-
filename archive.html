<!DOCTYPE html>
<html lang="zh-CN">


<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">


<title>

</title>


<link rel="stylesheet" href="../style.css">


</head>



<body>


<div class="terminal">


<div class="header">

NULL-01 DATABASE

</div>




<div class="content">



<p>

数据库连接成功。

</p>


<p>

可查询档案：

</p>



<button onclick="openArchive('001')">

档案 001

</button>


<button onclick="openArchive('002')">

档案 002

</button>


<button onclick="openArchive('NULL')">

异常档案

</button>




<div id="result">


</div>



<br>


<button onclick="back()">

返回日志

</button>



</div>


</div>




<script>



function openArchive(id){


let result =
document.getElementById("result");



if(id==="001"){


result.innerHTML=

`

<hr>

<p>
档案001
</p>


<p>
状态：
已删除
</p>


<p>

内容：

普通系统维护记录。

</p>

`;


}



else if(id==="002"){


result.innerHTML=

`

<hr>

<p>
档案002
</p>


<p>
状态：

访问失败

</p>


<p>

权限不足。

</p>

`;



}



else if(id==="NULL"){



result.innerHTML=

`

<hr>


<p>
发现异常档案：

NULL-01

</p>


<p>

状态：

不应该存在

</p>


<p>

备注：

此档案没有创建记录。

</p>


<p>

下一步线索：

SEARCH : "ZERO"

</p>


`;



}



}




function back(){


window.location.href="log.html";


}


</script>
